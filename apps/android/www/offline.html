<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RhoeFlow: no connection</title>
    <style>
      :root { color-scheme: light dark; --bg: #f4f3ee; --card: #ffffff; --ink: #1b2027; --muted: #5d6673; --gold: #ffb547; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0e1319; --card: #161d26; --ink: #e9ecef; --muted: #9aa4b1; } }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
      .card { background: var(--card); border-radius: 16px; padding: 28px 24px; max-width: 380px; width: 100%; text-align: center; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: var(--muted); }
      button { appearance: none; border: 0; border-radius: 10px; background: var(--gold); color: #1b2027; font: 600 16px/1 inherit; padding: 14px 22px; width: 100%; }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>No connection</h1>
        <p>RhoeFlow needs a signal to open your load calcs. Answers you already saved are safe.</p>
        <button type="button" onclick="window.location.replace('https://app.rhoeflow.pro/')">Try again</button>
      </div>
    </main>
  </body>
</html>
