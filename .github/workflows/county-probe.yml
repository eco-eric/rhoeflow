# Temporary (ADR-047): reads the layout of the Dallas and Tarrant appraisal downloads, which the
# build container can't reach, so the importers are written against the real files. Removed
# before the county-import PR is merged.
name: county-probe
on:
  push:
    branches: [county-import]
    paths: [tools/county-import/probe4.py, .github/workflows/county-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tarrant-tp-data
            url: 'https://www.tad.org/content/data-download/000_Tarrant_All_Taxing_Units.zip'
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          curl -fsSL --retry 3 -A "RhoeFlow county import (github.com/eco-eric/rhoeflow)" -o data.zip '${{ matrix.url }}'
          ls -l data.zip; file data.zip; sha256sum data.zip
      - name: Layout
        run: python3 -I tools/county-import/probe4.py data.zip
